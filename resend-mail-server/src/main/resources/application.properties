# Resend API key - required, no default, never hardcode a real value here
resend.api-key=${RESEND_API_KEY}

# Shared secret the caller must send in the "secret" field
mail.secret=${MAIL_SECRET}

# Sender address used for every outgoing email
mail.from=${MAIL_FROM}

# Render (and most PaaS platforms) inject PORT at runtime; default to 8080 locally
server.port=${PORT:8080}
